<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Serpents</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030814;
    color: #e0f2fe;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(0,255,200,0.4);
  }
  .hud-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(4, 16, 36, 0.65);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(4px);
  }
  .hud-val {
    font-weight: bold;
    color: #38bdf8;
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="hud-stat">
    <span>Length:</span>
    <span id="stat-length" class="hud-val">30</span>
  </div>
</div>

<script>
// ============================================================
// §1  CONSTANTS
// ============================================================
const BASE_SPEED = 3.2;          // Movement speed in px/frame
const TURN_RATE = 0.075;         // Steering agility (radians per frame)
const SEGMENT_SPACING = 7;       // Distance between vertebrae segments
const INITIAL_SEGMENTS = 30;     // Starting snake length
const HEAD_RADIUS = 13;          // Radius of serpent head

// Palette
const PALETTE_PLAYER = {
  head: '#00f5ff',
  bodyStart: '#06b6d4',
  bodyEnd: '#0369a1',
  scale: 'rgba(255, 255, 255, 0.35)',
  glow: 'rgba(0, 245, 255, 0.45)',
  eyeIris: '#0284c7',
  eyePupil: '#020617',
  tongue: '#f43f5e'
};

// ============================================================
// §2  STATE
// ============================================================
let canvas = null;
let ctx = null;
let width = window.innerWidth;
let height = window.innerHeight;
let animFrame = 0;

// Player snake state
const player = {
  x: width / 2,
  y: height / 2,
  angle: -Math.PI / 2,
  targetAngle: -Math.PI / 2,
  speed: BASE_SPEED,
  turnRate: TURN_RATE,
  length: INITIAL_SEGMENTS,
  segments: [],                  // [{x, y, angle, lateralWave}]
  palette: PALETTE_PLAYER,
  tongueTimer: 0,
  tongueProgress: 0,
  alive: true,
};

// Input state
const keys = { left: false, right: false };
const mouse = { x: width / 2, y: height / 2, active: false };

// ============================================================
// §3  TOROIDAL WRAP UTILITIES
// ============================================================

function wrap(val, max) {
  return ((val % max) + max) % max;
}

function toroidDelta(a, b, size) {
  let d = b - a;
  while (d > size * 0.5) d -= size;
  while (d < -size * 0.5) d += size;
  return d;
}

function angleDifference(current, target) {
  return Math.atan2(Math.sin(target - current), Math.cos(target - current));
}

// Color interpolation utility
function interpolateColor(hex1, hex2, factor) {
  const c1 = parseInt(hex1.slice(1), 16);
  const c2 = parseInt(hex2.slice(1), 16);

  const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;

  const r = Math.round(r1 + factor * (r2 - r1));
  const g = Math.round(g1 + factor * (g2 - g1));
  const b = Math.round(b1 + factor * (b2 - b1));

  return `rgb(${r}, ${g}, ${b})`;
}

// ============================================================
// §4  INPUT HANDLING
// ============================================================
function initInput() {
  window.addEventListener('resize', onResize);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('touchstart', onTouch, { passive: false });
  window.addEventListener('touchmove', onTouch, { passive: false });
  window.addEventListener('touchend', () => { mouse.active = false; }, { passive: false });
}

function onTouch(e) {
  e.preventDefault();
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
  }
}

function onResize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}

// ============================================================
// §5  UPDATE
// ============================================================

function initSnake() {
  player.x = width / 2;
  player.y = height / 2;
  player.angle = -Math.PI / 2;
  player.targetAngle = -Math.PI / 2;
  player.segments = [];
  
  for (let i = 0; i < player.length; i++) {
    player.segments.push({
      x: player.x,
      y: player.y + i * SEGMENT_SPACING,
      angle: player.angle,
      lateralOffset: 0
    });
  }
}

function updatePlayer() {
  animFrame++;

  // 1. Steering
  if (keys.left) {
    player.targetAngle -= player.turnRate;
    mouse.active = false;
  } else if (keys.right) {
    player.targetAngle += player.turnRate;
    mouse.active = false;
  } else if (mouse.active) {
    const dx = toroidDelta(player.x, mouse.x, width);
    const dy = toroidDelta(player.y, mouse.y, height);
    if (Math.hypot(dx, dy) > 15) {
      player.targetAngle = Math.atan2(dy, dx);
    }
  }

  const diff = angleDifference(player.angle, player.targetAngle);
  player.angle += Math.sign(diff) * Math.min(Math.abs(diff), player.turnRate);

  // 2. Head position
  player.x = wrap(player.x + Math.cos(player.angle) * player.speed, width);
  player.y = wrap(player.y + Math.sin(player.angle) * player.speed, height);

  // 3. Tongue flick cycle
  player.tongueTimer++;
  if (player.tongueTimer > 180) { // every 3 seconds
    player.tongueProgress = Math.sin(((player.tongueTimer - 180) / 25) * Math.PI);
    if (player.tongueTimer >= 205) {
      player.tongueTimer = 0;
      player.tongueProgress = 0;
    }
  }

  // 4. Update body chain segments
  let prevX = player.x;
  let prevY = player.y;

  for (let i = 0; i < player.segments.length; i++) {
    const seg = player.segments[i];
    const dx = toroidDelta(seg.x, prevX, width);
    const dy = toroidDelta(seg.y, prevY, height);
    const dist = Math.hypot(dx, dy);

    if (dist > SEGMENT_SPACING) {
      const segAngle = Math.atan2(dy, dx);
      seg.angle = segAngle;
      seg.x = wrap(prevX - Math.cos(segAngle) * SEGMENT_SPACING, width);
      seg.y = wrap(prevY - Math.sin(segAngle) * SEGMENT_SPACING, height);
    }

    // Sine-wave undulation: organic swimming slither
    // Amplitude increases along body then dampens near tail
    const waveProgress = i / player.segments.length;
    const waveAmp = Math.sin(waveProgress * Math.PI) * 4.5;
    seg.lateralOffset = Math.sin(animFrame * 0.14 - i * 0.32) * waveAmp;

    prevX = seg.x;
    prevY = seg.y;
  }
}

function update() {
  updatePlayer();
}

// ============================================================
// §6  RENDER: REALISTIC SERPENT GRAPHICS
// ============================================================

/** Draw a diamond scale pattern on a body segment */
function drawDiamondScale(cx, cy, radius, angle, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, -radius * 0.7);
  ctx.lineTo(radius * 0.6, 0);
  ctx.lineTo(0, radius * 0.7);
  ctx.lineTo(-radius * 0.6, 0);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

/** Render snake with realistic tapered body, scales, tongue, and eyes */
function drawRealisticSnakeAt(snake, offsetX, offsetY) {
  const segs = snake.segments;
  if (segs.length === 0) return;

  ctx.save();
  ctx.translate(offsetX, offsetY);

  const pal = snake.palette;

  // 1. Tongue (drawn underneath head)
  if (snake.tongueProgress > 0) {
    const tLen = snake.tongueProgress * 16;
    const hx = snake.x + Math.cos(snake.angle) * HEAD_RADIUS;
    const hy = snake.y + Math.sin(snake.angle) * HEAD_RADIUS;
    const tx = hx + Math.cos(snake.angle) * tLen;
    const ty = hy + Math.sin(snake.angle) * tLen;

    const forkAngle = 0.45;
    const forkLen = 5 * snake.tongueProgress;
    const f1x = tx + Math.cos(snake.angle + forkAngle) * forkLen;
    const f1y = ty + Math.sin(snake.angle + forkAngle) * forkLen;
    const f2x = tx + Math.cos(snake.angle - forkAngle) * forkLen;
    const f2y = ty + Math.sin(snake.angle - forkAngle) * forkLen;

    ctx.strokeStyle = pal.tongue;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(tx, ty);
    ctx.lineTo(f1x, f1y);
    ctx.moveTo(tx, ty);
    ctx.lineTo(f2x, f2y);
    ctx.stroke();
  }

  // 2. Body segments (tail to neck)
  for (let i = segs.length - 1; i >= 0; i--) {
    const seg = segs[i];
    const progress = i / segs.length; // 0 near head, 1 at tail

    // Tapering: thicker near head (neck 11px), tapering to fine tail (3.5px)
    const radius = Math.max(3.5, HEAD_RADIUS * (1 - progress * 0.72));

    // Calculate undulating position (perpendicular lateral offset)
    const perpAngle = seg.angle + Math.PI / 2;
    const drawX = seg.x + Math.cos(perpAngle) * seg.lateralOffset;
    const drawY = seg.y + Math.sin(perpAngle) * seg.lateralOffset;

    // Body gradient color
    const segColor = interpolateColor(pal.bodyStart, pal.bodyEnd, progress);

    // Segment base with soft neon glow
    ctx.beginPath();
    ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
    ctx.fillStyle = segColor;
    if (i % 5 === 0) {
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = 6;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.fill();

    // Subtle dorsal ridge / scale highlight on alternating segments
    if (i % 2 === 0 && radius > 5) {
      drawDiamondScale(drawX, drawY, radius * 0.75, seg.angle, pal.scale);
    }
  }

  ctx.shadowBlur = 0;

  // 3. Head (sculpted predator shape)
  ctx.save();
  ctx.translate(snake.x, snake.y);
  ctx.rotate(snake.angle);

  // Soft neon halo around head
  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 16;

  // Head contour (oval tapered snout)
  ctx.beginPath();
  ctx.ellipse(2, 0, HEAD_RADIUS + 1, HEAD_RADIUS - 1.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = pal.head;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Snout crown accent
  ctx.beginPath();
  ctx.ellipse(5, 0, HEAD_RADIUS * 0.45, HEAD_RADIUS * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fill();

  // 4. Eyes with realistic irises and pupils looking forward
  const eyeX = 3;
  const eyeY = 6.2;
  const eyeRadius = 3.6;
  const pupilRadius = 1.6;

  // Draw both eyes
  [-eyeY, eyeY].forEach((ey) => {
    // Eye socket
    ctx.beginPath();
    ctx.arc(eyeX, ey, eyeRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Iris
    ctx.beginPath();
    ctx.arc(eyeX + 0.8, ey, eyeRadius * 0.65, 0, Math.PI * 2);
    ctx.fillStyle = pal.eyeIris;
    ctx.fill();

    // Slit/pupil oriented forward
    ctx.beginPath();
    ctx.arc(eyeX + 1.2, ey, pupilRadius, 0, Math.PI * 2);
    ctx.fillStyle = pal.eyePupil;
    ctx.fill();

    // Specular light reflection
    ctx.beginPath();
    ctx.arc(eyeX + 0.5, ey - 1, 0.8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  });

  ctx.restore();
  ctx.restore();
}

/** Draws snake with wrap-around clones */
function drawSnakeToroidal(snake) {
  const offsets = [
    [0, 0],
    [width, 0], [-width, 0],
    [0, height], [0, -height],
    [width, height], [-width, height],
    [width, -height], [-width, -height]
  ];

  for (const [ox, oy] of offsets) {
    drawRealisticSnakeAt(snake, ox, oy);
  }
}

function render() {
  ctx.fillStyle = '#030814';
  ctx.fillRect(0, 0, width, height);

  // Subtle background grid
  ctx.strokeStyle = 'rgba(30, 58, 138, 0.15)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = 0; x < width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
  }
  for (let y = 0; y < height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }

  // Draw realistic serpent
  drawSnakeToroidal(player);
}

// ============================================================
// §7  LOOP
// ============================================================
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  onResize();
  initInput();
  initSnake();
  requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
