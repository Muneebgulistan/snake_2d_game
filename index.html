<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Serpents</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
    color: #e0f2fe;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    pointer-events: none;
    display: flex;
    gap: 10px;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(0,255,200,0.4);
    flex-wrap: wrap;
  }
  .hud-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(4, 16, 36, 0.7);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(0, 240, 255, 0.25);
    backdrop-filter: blur(6px);
  }
  .hud-val {
    font-weight: bold;
    color: #38bdf8;
  }

  /* Game Over Overlay */
  #overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(2, 6, 23, 0.82);
    backdrop-filter: blur(8px);
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #overlay h2 {
    font-size: 42px;
    color: #f43f5e;
    text-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .score-card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 16px;
    padding: 20px 32px;
    margin-bottom: 24px;
    min-width: 280px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    font-size: 16px;
  }
  .score-row .label { color: #94a3b8; }
  .score-row .val { color: #38bdf8; font-weight: bold; }
  .score-row .best { color: #facc15; font-weight: bold; }
  .restart-hint {
    color: #cbd5e1;
    font-size: 16px;
    animation: pulseHint 1.8s infinite ease-in-out;
    cursor: pointer;
  }
  @keyframes pulseHint {
    0%, 100% { opacity: 0.6; transform: scale(0.98); }
    50% { opacity: 1; transform: scale(1.02); }
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-stat">
    <span>Time:</span>
    <span id="stat-time" class="hud-val">00:00</span>
  </div>
  <div class="hud-stat">
    <span>Length:</span>
    <span id="stat-length" class="hud-val">30</span>
  </div>
  <div class="hud-stat">
    <span>Rank:</span>
    <span id="stat-rank" class="hud-val">#1</span>
  </div>
</div>

<!-- Game Over Overlay -->
<div id="overlay">
  <h2>SERPENT DISSOLVED</h2>
  <div class="score-card">
    <div class="score-row">
      <span class="label">Survival Time:</span>
      <span id="final-time" class="val">00:00</span>
    </div>
    <div class="score-row">
      <span class="label">Best Time:</span>
      <span id="best-time" class="best">00:00</span>
    </div>
    <div class="score-row">
      <span class="label">Final Length:</span>
      <span id="final-length" class="val">30</span>
    </div>
    <div class="score-row">
      <span class="label">Best Length:</span>
      <span id="best-length" class="best">30</span>
    </div>
  </div>
  <div class="restart-hint">Press Enter or Tap to Restart</div>
</div>

<script>
// ============================================================
// §1  CONSTANTS
// ============================================================
const BASE_SPEED = 3.2;          // Movement speed in px/frame
const TURN_RATE = 0.075;         // Steering agility (radians per frame)
const SEGMENT_SPACING = 7;       // Distance between vertebrae segments
const INITIAL_SEGMENTS = 30;     // Starting snake length
const HEAD_RADIUS = 13;          // Radius of serpent head
const PLANKTON_COUNT = 55;       // Bioluminescent ambient particles
const FOOD_COUNT = 65;           // Total food orbs maintained in world
const BOT_COUNT = 6;             // Exactly 6 AI bots
const RESPAWN_DELAY_FRAMES = 180;// 3 seconds at 60fps

const FOOD_COLORS = [
  { core: '#22d3ee', glow: 'rgba(34, 211, 238, 0.5)' },
  { core: '#f43f5e', glow: 'rgba(244, 63, 94, 0.5)' },
  { core: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)' },
  { core: '#10b981', glow: 'rgba(16, 185, 129, 0.5)' },
  { core: '#fbbf24', glow: 'rgba(251, 191, 36, 0.5)' }
];

const PALETTE_PLAYER = {
  head: '#00f5ff',
  bodyStart: '#06b6d4',
  bodyEnd: '#0369a1',
  scale: 'rgba(255, 255, 255, 0.35)',
  glow: 'rgba(0, 245, 255, 0.45)',
  eyeIris: '#0284c7',
  eyePupil: '#020617',
  tongue: '#f43f5e'
};

// 6 Distinct Bot Palettes & Names
const BOT_CONFIGS = [
  {
    name: 'Viper',
    palette: {
      head: '#10b981', bodyStart: '#059669', bodyEnd: '#047857',
      scale: 'rgba(167, 243, 208, 0.35)', glow: 'rgba(16, 185, 129, 0.45)',
      eyeIris: '#047857', eyePupil: '#022c22', tongue: '#f87171'
    }
  },
  {
    name: 'Hydra',
    palette: {
      head: '#c084fc', bodyStart: '#9333ea', bodyEnd: '#6b21a8',
      scale: 'rgba(233, 213, 255, 0.35)', glow: 'rgba(192, 132, 252, 0.45)',
      eyeIris: '#6b21a8', eyePupil: '#2e1065', tongue: '#fb7185'
    }
  },
  {
    name: 'Cobra',
    palette: {
      head: '#f59e0b', bodyStart: '#d97706', bodyEnd: '#b45309',
      scale: 'rgba(254, 240, 138, 0.35)', glow: 'rgba(245, 158, 11, 0.45)',
      eyeIris: '#b45309', eyePupil: '#451a03', tongue: '#f43f5e'
    }
  },
  {
    name: 'Abyss',
    palette: {
      head: '#f43f5e', bodyStart: '#e11d48', bodyEnd: '#9f1239',
      scale: 'rgba(254, 205, 211, 0.35)', glow: 'rgba(244, 63, 94, 0.45)',
      eyeIris: '#9f1239', eyePupil: '#4c0519', tongue: '#fda4af'
    }
  },
  {
    name: 'Phantom',
    palette: {
      head: '#f472b6', bodyStart: '#db2777', bodyEnd: '#9d174d',
      scale: 'rgba(251, 207, 232, 0.35)', glow: 'rgba(244, 114, 182, 0.45)',
      eyeIris: '#9d174d', eyePupil: '#500724', tongue: '#a78bfa'
    }
  },
  {
    name: 'Apex',
    palette: {
      head: '#a3e635', bodyStart: '#65a30d', bodyEnd: '#3f6212',
      scale: 'rgba(217, 249, 157, 0.35)', glow: 'rgba(163, 230, 53, 0.45)',
      eyeIris: '#3f6212', eyePupil: '#1a2e05', tongue: '#f43f5e'
    }
  }
];

// ============================================================
// §2  STATE
// ============================================================
let canvas = null;
let ctx = null;
let width = window.innerWidth;
let height = window.innerHeight;
let animFrame = 0;

let isGameOver = false;
let gameStartTime = 0;
let survivalSeconds = 0;
let bestSurvivalSeconds = 0;
let bestLength = INITIAL_SEGMENTS;
let shakeIntensity = 0;

const foodOrbs = [];
const particles = [];
const plankton = [];
const bots = [];

// Player serpent
const player = {
  name: 'You',
  isPlayer: true,
  x: width / 2,
  y: height / 2,
  angle: -Math.PI / 2,
  targetAngle: -Math.PI / 2,
  speed: BASE_SPEED,
  turnRate: TURN_RATE,
  length: INITIAL_SEGMENTS,
  segments: [],
  palette: PALETTE_PLAYER,
  tongueTimer: 0,
  tongueProgress: 0,
  bulges: [],
  growQueue: 0,
  alive: true,
};

const keys = { left: false, right: false };
const mouse = { x: width / 2, y: height / 2, active: false };

let statTimeEl = null;
let statLengthEl = null;
let statRankEl = null;
let overlayEl = null;
let finalTimeEl = null;
let bestTimeEl = null;
let finalLengthEl = null;
let bestLengthEl = null;

// ============================================================
// §3  TOROIDAL WRAP UTILITIES
// ============================================================

function wrap(val, max) {
  return ((val % max) + max) % max;
}

function toroidDelta(a, b, size) {
  let d = b - a;
  while (d > size * 0.5) d -= size;
  while (d < -size * 0.5) d += size;
  return d;
}

function toroidDistSq(x1, y1, x2, y2) {
  const dx = toroidDelta(x1, x2, width);
  const dy = toroidDelta(y1, y2, height);
  return dx * dx + dy * dy;
}

function angleDifference(current, target) {
  return Math.atan2(Math.sin(target - current), Math.cos(target - current));
}

function interpolateColor(hex1, hex2, factor) {
  const c1 = parseInt(hex1.slice(1), 16);
  const c2 = parseInt(hex2.slice(1), 16);

  const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;

  const r = Math.round(r1 + factor * (r2 - r1));
  const g = Math.round(g1 + factor * (g2 - g1));
  const b = Math.round(b1 + factor * (b2 - b1));

  return `rgb(${r}, ${g}, ${b})`;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// ============================================================
// §4  BACKGROUND, FOOD & PARTICLES
// ============================================================

function initPlankton() {
  plankton.length = 0;
  for (let i = 0; i < PLANKTON_COUNT; i++) {
    plankton.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: 1 + Math.random() * 2.2,
      baseAlpha: 0.15 + Math.random() * 0.45,
      vx: (Math.random() - 0.5) * 0.35,
      vy: -0.15 - Math.random() * 0.35,
      pulseSpeed: 0.02 + Math.random() * 0.03,
      pulsePhase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.4 ? 'rgba(56, 189, 248, ' : 'rgba(45, 212, 191, '
    });
  }
}

function updatePlankton() {
  for (const p of plankton) {
    p.x = wrap(p.x + p.vx, width);
    p.y = wrap(p.y + p.vy, height);
  }
}

function isFarFromAllSnakes(x, y, minDist = 60) {
  const minDistSq = minDist * minDist;
  const allSnakes = [player, ...bots];
  for (const s of allSnakes) {
    if (!s.alive) continue;
    if (toroidDistSq(s.x, s.y, x, y) < minDistSq) return false;
    for (let i = 0; i < s.segments.length; i += 3) {
      if (toroidDistSq(s.segments[i].x, s.segments[i].y, x, y) < minDistSq) return false;
    }
  }
  return true;
}

function spawnFoodOrb(customX, customY, customColor) {
  let x = customX !== undefined ? customX : Math.random() * width;
  let y = customY !== undefined ? customY : Math.random() * height;

  if (customX === undefined) {
    for (let attempt = 0; attempt < 25; attempt++) {
      if (isFarFromAllSnakes(x, y, 45)) break;
      x = Math.random() * width;
      y = Math.random() * height;
    }
  }

  const scheme = customColor || FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];
  return {
    x,
    y,
    baseRadius: 4.5 + Math.random() * 2,
    color: scheme.core,
    glow: scheme.glow,
    pulseSpeed: 0.04 + Math.random() * 0.04,
    pulsePhase: Math.random() * Math.PI * 2,
    vx: (Math.random() - 0.5) * 0.25,
    vy: (Math.random() - 0.5) * 0.25,
  };
}

function initFood() {
  foodOrbs.length = 0;
  for (let i = 0; i < FOOD_COUNT; i++) {
    foodOrbs.push(spawnFoodOrb());
  }
}

function updateFood() {
  for (const orb of foodOrbs) {
    orb.x = wrap(orb.x + orb.vx, width);
    orb.y = wrap(orb.y + orb.vy, height);
  }
  while (foodOrbs.length < FOOD_COUNT) {
    foodOrbs.push(spawnFoodOrb());
  }
}

function spawnFoodBurst(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 3.2;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 2.5,
      alpha: 1,
      color,
      decay: 0.03 + Math.random() * 0.02
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x = wrap(p.x + p.vx, width);
    p.y = wrap(p.y + p.vy, height);
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

// ============================================================
// §5  BOTS CREATION & BEHAVIOR
// ============================================================

function createBot(config, index) {
  // Safe spawn position
  let bx = Math.random() * width;
  let by = Math.random() * height;
  for (let attempt = 0; attempt < 50; attempt++) {
    if (isFarFromAllSnakes(bx, by, 90)) break;
    bx = Math.random() * width;
    by = Math.random() * height;
  }

  const initialAngle = Math.random() * Math.PI * 2;
  const initialLength = INITIAL_SEGMENTS - 5 + Math.floor(Math.random() * 12);
  const segments = [];

  for (let i = 0; i < initialLength; i++) {
    segments.push({
      x: bx,
      y: by + i * SEGMENT_SPACING,
      angle: initialAngle,
      lateralOffset: 0
    });
  }

  return {
    name: config.name,
    isPlayer: false,
    x: bx,
    y: by,
    angle: initialAngle,
    targetAngle: initialAngle,
    speed: BASE_SPEED * (0.95 + Math.random() * 0.1),
    turnRate: TURN_RATE * (0.9 + Math.random() * 0.2),
    length: initialLength,
    segments,
    palette: config.palette,
    tongueTimer: Math.floor(Math.random() * 150),
    tongueProgress: 0,
    bulges: [],
    growQueue: 0,
    alive: true,
    respawnTimer: 0,
    personality: {
      aggressiveness: 0.2 + Math.random() * 0.5,
      lookAheadDist: 50 + Math.random() * 30
    }
  };
}

function initBots() {
  bots.length = 0;
  for (let i = 0; i < BOT_COUNT; i++) {
    bots.push(createBot(BOT_CONFIGS[i], i));
  }
}

function respawnBot(bot) {
  let bx = Math.random() * width;
  let by = Math.random() * height;
  for (let attempt = 0; attempt < 60; attempt++) {
    if (isFarFromAllSnakes(bx, by, 100)) break;
    bx = Math.random() * width;
    by = Math.random() * height;
  }

  bot.x = bx;
  bot.y = by;
  bot.angle = Math.random() * Math.PI * 2;
  bot.targetAngle = bot.angle;
  bot.length = INITIAL_SEGMENTS - 5 + Math.floor(Math.random() * 8);
  bot.segments = [];
  bot.bulges = [];
  bot.growQueue = 0;
  bot.alive = true;
  bot.respawnTimer = 0;

  for (let i = 0; i < bot.length; i++) {
    bot.segments.push({
      x: bx,
      y: by + i * SEGMENT_SPACING,
      angle: bot.angle,
      lateralOffset: 0
    });
  }
}

/** AI decision making for each bot */
function updateBotAI(bot) {
  if (!bot.alive) return;

  const allSnakes = [player, ...bots];

  // 1. Find nearest food
  let nearestFood = null;
  let nearestDistSq = Infinity;
  for (const orb of foodOrbs) {
    const dSq = toroidDistSq(bot.x, bot.y, orb.x, orb.y);
    if (dSq < nearestDistSq) {
      nearestDistSq = dSq;
      nearestFood = orb;
    }
  }

  let desiredAngle = bot.angle;
  if (nearestFood) {
    const dx = toroidDelta(bot.x, nearestFood.x, width);
    const dy = toroidDelta(bot.y, nearestFood.y, height);
    desiredAngle = Math.atan2(dy, dx);
  }

  // 2. Trapping / Cutting-off behavior (especially against player or nearby bots)
  if (player.alive && Math.random() < bot.personality.aggressiveness) {
    const dToPlayerSq = toroidDistSq(bot.x, bot.y, player.x, player.y);
    if (dToPlayerSq < 180 * 180 && dToPlayerSq > 50 * 50) {
      // Aim slightly ahead of player's head to cut them off
      const leadDist = 50;
      const leadX = wrap(player.x + Math.cos(player.angle) * leadDist, width);
      const leadY = wrap(player.y + Math.sin(player.angle) * leadDist, height);
      const cdx = toroidDelta(bot.x, leadX, width);
      const cdy = toroidDelta(bot.y, leadY, height);
      desiredAngle = Math.atan2(cdy, cdx);
    }
  }

  // 3. Obstacle avoidance (lookahead whiskers)
  const lookDist = bot.personality.lookAheadDist;
  const sensorAngles = [0, 0.5, -0.5, 0.9, -0.9, 1.4, -1.4];
  let bestDanger = 0;
  let avoidTurn = 0;

  for (const sa of sensorAngles) {
    const checkAngle = bot.angle + sa;
    const probeX = wrap(bot.x + Math.cos(checkAngle) * lookDist, width);
    const probeY = wrap(bot.y + Math.sin(checkAngle) * lookDist, height);

    // Check danger against all other snakes' bodies
    let probeDanger = 0;
    for (const other of allSnakes) {
      if (!other.alive) continue;
      // Skip own body near head (first 5 segments)
      const startSeg = (other === bot) ? 6 : 0;
      for (let i = startSeg; i < other.segments.length; i += 2) {
        const seg = other.segments[i];
        const distSq = toroidDistSq(probeX, probeY, seg.x, seg.y);
        const dangerRadius = HEAD_RADIUS + 10;
        if (distSq < dangerRadius * dangerRadius) {
          probeDanger += 1 / (1 + Math.sqrt(distSq));
        }
      }
    }

    if (probeDanger > 0) {
      // Danger detected: turn away proportional to sensor angle
      avoidTurn += (sa === 0 ? (Math.random() > 0.5 ? 1.5 : -1.5) : -Math.sign(sa) * 1.8);
      bestDanger += probeDanger;
    }
  }

  if (bestDanger > 0) {
    bot.targetAngle = bot.angle + avoidTurn;
  } else {
    // Add small wandering drift so bots don't steer in rigid straight lines
    bot.targetAngle = desiredAngle + (Math.random() - 0.5) * 0.15;
  }

  // Smooth turn
  const diff = angleDifference(bot.angle, bot.targetAngle);
  bot.angle += Math.sign(diff) * Math.min(Math.abs(diff), bot.turnRate);
}

// ============================================================
// §6  PHYSICS & UPDATE
// ============================================================

function advanceSnake(snake) {
  if (!snake.alive) return;

  // Move head
  snake.x = wrap(snake.x + Math.cos(snake.angle) * snake.speed, width);
  snake.y = wrap(snake.y + Math.sin(snake.angle) * snake.speed, height);

  // Tongue flick
  snake.tongueTimer++;
  if (snake.tongueTimer > 180) {
    snake.tongueProgress = Math.sin(((snake.tongueTimer - 180) / 25) * Math.PI);
    if (snake.tongueTimer >= 205) {
      snake.tongueTimer = 0;
      snake.tongueProgress = 0;
    }
  }

  // Update bulges
  for (let b = snake.bulges.length - 1; b >= 0; b--) {
    snake.bulges[b].index += 0.75;
    if (snake.bulges[b].index >= snake.segments.length) {
      snake.bulges.splice(b, 1);
    }
  }

  // Grow tail
  if (snake.growQueue > 0 && snake.segments.length > 0) {
    const tail = snake.segments[snake.segments.length - 1];
    snake.segments.push({
      x: tail.x,
      y: tail.y,
      angle: tail.angle,
      lateralOffset: 0
    });
    snake.growQueue--;
  }

  // Follow segments
  let prevX = snake.x;
  let prevY = snake.y;

  for (let i = 0; i < snake.segments.length; i++) {
    const seg = snake.segments[i];
    const dx = toroidDelta(seg.x, prevX, width);
    const dy = toroidDelta(seg.y, prevY, height);
    const dist = Math.hypot(dx, dy);

    if (dist > SEGMENT_SPACING) {
      const segAngle = Math.atan2(dy, dx);
      seg.angle = segAngle;
      seg.x = wrap(prevX - Math.cos(segAngle) * SEGMENT_SPACING, width);
      seg.y = wrap(prevY - Math.sin(segAngle) * SEGMENT_SPACING, height);
    }

    const waveProgress = i / snake.segments.length;
    const waveAmp = Math.sin(waveProgress * Math.PI) * 4.5;
    seg.lateralOffset = Math.sin(animFrame * 0.14 - i * 0.32) * waveAmp;

    prevX = seg.x;
    prevY = seg.y;
  }
}

function dissolveSnakeIntoFood(snake) {
  for (let i = 0; i < snake.segments.length; i += 2) {
    const seg = snake.segments[i];
    const foodScheme = {
      core: snake.palette.head,
      glow: snake.palette.glow
    };
    foodOrbs.push(spawnFoodOrb(seg.x, seg.y, foodScheme));
    spawnFoodBurst(seg.x, seg.y, snake.palette.head, 4);
  }
  spawnFoodBurst(snake.x, snake.y, snake.palette.head, 16);
}

function killBot(bot) {
  if (!bot.alive) return;
  bot.alive = false;
  bot.respawnTimer = RESPAWN_DELAY_FRAMES;
  dissolveSnakeIntoFood(bot);
}

function handlePlayerDeath() {
  if (!player.alive || isGameOver) return;
  player.alive = false;
  isGameOver = true;
  shakeIntensity = 18;

  dissolveSnakeIntoFood(player);

  if (survivalSeconds > bestSurvivalSeconds) bestSurvivalSeconds = survivalSeconds;
  if (player.length > bestLength) bestLength = player.length;

  finalTimeEl.textContent = formatTime(survivalSeconds);
  bestTimeEl.textContent = formatTime(bestSurvivalSeconds);
  finalLengthEl.textContent = player.length;
  bestLengthEl.textContent = bestLength;
  overlayEl.style.display = 'flex';
}

function checkAllCollisions() {
  const allSnakes = [player, ...bots];
  const collisionRadius = HEAD_RADIUS * 0.85 + 5.5;
  const collisionDistSq = collisionRadius * collisionRadius;

  // Check each snake's head against every OTHER snake's body
  for (const snake of allSnakes) {
    if (!snake.alive) continue;

    for (const other of allSnakes) {
      if (!other.alive || other === snake) continue;

      for (let i = 0; i < other.segments.length; i++) {
        const seg = other.segments[i];
        if (toroidDistSq(snake.x, snake.y, seg.x, seg.y) < collisionDistSq) {
          if (snake.isPlayer) {
            handlePlayerDeath();
          } else {
            killBot(snake);
          }
          break;
        }
      }
      if (!snake.alive) break;
    }
  }
}

function checkFoodConsumptionAll() {
  const allSnakes = [player, ...bots];
  const eatDistSq = (HEAD_RADIUS + 8) * (HEAD_RADIUS + 8);

  for (const snake of allSnakes) {
    if (!snake.alive) continue;

    for (let i = foodOrbs.length - 1; i >= 0; i--) {
      const orb = foodOrbs[i];
      if (toroidDistSq(snake.x, snake.y, orb.x, orb.y) < eatDistSq) {
        spawnFoodBurst(orb.x, orb.y, orb.color, 8);
        foodOrbs.splice(i, 1);

        snake.bulges.push({ index: 0, strength: 0.65 });
        snake.growQueue++;
        snake.length++;

        if (snake.isPlayer && statLengthEl) {
          statLengthEl.textContent = snake.length;
        }
      }
    }
  }
}

function updateHUD() {
  if (!isGameOver) {
    survivalSeconds = Math.floor((performance.now() - gameStartTime) / 1000);
    if (statTimeEl) statTimeEl.textContent = formatTime(survivalSeconds);
  }

  // Calculate live rank among all 7 serpents
  const allSnakes = [player, ...bots];
  allSnakes.sort((a, b) => b.length - a.length);
  const playerRank = allSnakes.findIndex(s => s.isPlayer) + 1;
  if (statRankEl) statRankEl.textContent = `#${playerRank}`;
}

function update() {
  animFrame++;

  // Update Player Steering
  if (player.alive) {
    if (keys.left) {
      player.targetAngle -= player.turnRate;
      mouse.active = false;
    } else if (keys.right) {
      player.targetAngle += player.turnRate;
      mouse.active = false;
    } else if (mouse.active) {
      const dx = toroidDelta(player.x, mouse.x, width);
      const dy = toroidDelta(player.y, mouse.y, height);
      if (Math.hypot(dx, dy) > 15) {
        player.targetAngle = Math.atan2(dy, dx);
      }
    }
    const diff = angleDifference(player.angle, player.targetAngle);
    player.angle += Math.sign(diff) * Math.min(Math.abs(diff), player.turnRate);
  }

  // Update Player Physics
  advanceSnake(player);

  // Update Bots
  for (const bot of bots) {
    if (!bot.alive) {
      bot.respawnTimer--;
      if (bot.respawnTimer <= 0) {
        respawnBot(bot);
      }
      continue;
    }
    updateBotAI(bot);
    advanceSnake(bot);
  }

  // Collisions & Food
  checkAllCollisions();
  checkFoodConsumptionAll();

  // World Elements
  updateFood();
  updateParticles();
  updatePlankton();
  updateHUD();

  if (shakeIntensity > 0) {
    shakeIntensity *= 0.9;
    if (shakeIntensity < 0.2) shakeIntensity = 0;
  }
}

// ============================================================
// §7  INPUT & RESTART
// ============================================================

function initInput() {
  window.addEventListener('resize', onResize);

  window.addEventListener('keydown', (e) => {
    if (isGameOver) {
      if (e.key === 'Enter') restartGame();
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('touchstart', onTouch, { passive: false });
  window.addEventListener('touchmove', onTouch, { passive: false });
  window.addEventListener('touchend', () => { mouse.active = false; }, { passive: false });

  overlayEl.addEventListener('click', () => {
    if (isGameOver) restartGame();
  });
}

function onTouch(e) {
  e.preventDefault();
  if (isGameOver) {
    restartGame();
    return;
  }
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
  }
}

function onResize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}

function initSnake() {
  player.x = width / 2;
  player.y = height / 2;
  player.angle = -Math.PI / 2;
  player.targetAngle = -Math.PI / 2;
  player.length = INITIAL_SEGMENTS;
  player.growQueue = 0;
  player.bulges = [];
  player.segments = [];
  player.alive = true;
  
  for (let i = 0; i < player.length; i++) {
    player.segments.push({
      x: player.x,
      y: player.y + i * SEGMENT_SPACING,
      angle: player.angle,
      lateralOffset: 0
    });
  }

  gameStartTime = performance.now();
  isGameOver = false;
  overlayEl.style.display = 'none';

  if (statLengthEl) statLengthEl.textContent = player.length;
  if (statRankEl) statRankEl.textContent = '#1';
}

function restartGame() {
  overlayEl.style.display = 'none';
  initSnake();
  initBots();
}

// ============================================================
// §8  RENDER: BACKGROUND, FOOD & ALL 7 SERPENTS
// ============================================================

function renderBackground() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
  bgGrad.addColorStop(0, '#030816');
  bgGrad.addColorStop(0.5, '#020b1f');
  bgGrad.addColorStop(1, '#01050f');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 4; i++) {
    const rayAngle = -0.35 + Math.sin(animFrame * 0.008 + i * 1.5) * 0.05;
    const rayX = ((width * (0.2 + i * 0.28)) + Math.sin(animFrame * 0.005 + i) * 60) % width;

    const rayGrad = ctx.createLinearGradient(rayX, 0, rayX + Math.tan(rayAngle) * height, height);
    rayGrad.addColorStop(0, 'rgba(56, 189, 248, 0.05)');
    rayGrad.addColorStop(0.5, 'rgba(14, 165, 233, 0.025)');
    rayGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');

    ctx.fillStyle = rayGrad;
    ctx.beginPath();
    ctx.moveTo(rayX - 35, 0);
    ctx.lineTo(rayX + 55, 0);
    ctx.lineTo(rayX + Math.tan(rayAngle) * height + 120, height);
    ctx.lineTo(rayX + Math.tan(rayAngle) * height - 80, height);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  for (const p of plankton) {
    const pulse = Math.sin(animFrame * p.pulseSpeed + p.pulsePhase);
    const alpha = p.baseAlpha + pulse * 0.15;
    ctx.fillStyle = p.color + alpha + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderFood() {
  for (const orb of foodOrbs) {
    const pulse = Math.sin(animFrame * orb.pulseSpeed + orb.pulsePhase);
    const radius = orb.baseRadius + pulse * 1.2;

    ctx.fillStyle = orb.glow;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, radius * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = orb.color;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(orb.x - radius * 0.25, orb.y - radius * 0.25, radius * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawDiamondScale(cx, cy, radius, angle, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, -radius * 0.7);
  ctx.lineTo(radius * 0.6, 0);
  ctx.lineTo(0, radius * 0.7);
  ctx.lineTo(-radius * 0.6, 0);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawRealisticSnakeAt(snake, offsetX, offsetY) {
  if (!snake.alive) return;
  const segs = snake.segments;
  if (segs.length === 0) return;

  ctx.save();
  ctx.translate(offsetX, offsetY);

  const pal = snake.palette;

  // Tongue
  if (snake.tongueProgress > 0) {
    const tLen = snake.tongueProgress * 16;
    const hx = snake.x + Math.cos(snake.angle) * HEAD_RADIUS;
    const hy = snake.y + Math.sin(snake.angle) * HEAD_RADIUS;
    const tx = hx + Math.cos(snake.angle) * tLen;
    const ty = hy + Math.sin(snake.angle) * tLen;

    const forkAngle = 0.45;
    const forkLen = 5 * snake.tongueProgress;
    const f1x = tx + Math.cos(snake.angle + forkAngle) * forkLen;
    const f1y = ty + Math.sin(snake.angle + forkAngle) * forkLen;
    const f2x = tx + Math.cos(snake.angle - forkAngle) * forkLen;
    const f2y = ty + Math.sin(snake.angle - forkAngle) * forkLen;

    ctx.strokeStyle = pal.tongue;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(tx, ty);
    ctx.lineTo(f1x, f1y);
    ctx.moveTo(tx, ty);
    ctx.lineTo(f2x, f2y);
    ctx.stroke();
  }

  // Body segments
  for (let i = segs.length - 1; i >= 0; i--) {
    const seg = segs[i];
    const progress = i / segs.length;
    let radius = Math.max(3.5, HEAD_RADIUS * (1 - progress * 0.72));

    for (const b of snake.bulges) {
      const dist = Math.abs(i - b.index);
      if (dist < 3.5) {
        radius *= (1 + (1 - dist / 3.5) * b.strength);
      }
    }

    const perpAngle = seg.angle + Math.PI / 2;
    const drawX = seg.x + Math.cos(perpAngle) * seg.lateralOffset;
    const drawY = seg.y + Math.sin(perpAngle) * seg.lateralOffset;

    const segColor = interpolateColor(pal.bodyStart, pal.bodyEnd, progress);

    ctx.beginPath();
    ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
    ctx.fillStyle = segColor;
    if (i % 6 === 0) {
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = 6;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.fill();

    if (i % 2 === 0 && radius > 5) {
      drawDiamondScale(drawX, drawY, radius * 0.75, seg.angle, pal.scale);
    }
  }

  ctx.shadowBlur = 0;

  // Head
  ctx.save();
  ctx.translate(snake.x, snake.y);
  ctx.rotate(snake.angle);

  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 16;

  ctx.beginPath();
  ctx.ellipse(2, 0, HEAD_RADIUS + 1, HEAD_RADIUS - 1.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = pal.head;
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.ellipse(5, 0, HEAD_RADIUS * 0.45, HEAD_RADIUS * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fill();

  // Eyes
  const eyeX = 3;
  const eyeY = 6.2;
  const eyeRadius = 3.6;
  const pupilRadius = 1.6;

  [-eyeY, eyeY].forEach((ey) => {
    ctx.beginPath();
    ctx.arc(eyeX, ey, eyeRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eyeX + 0.8, ey, eyeRadius * 0.65, 0, Math.PI * 2);
    ctx.fillStyle = pal.eyeIris;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eyeX + 1.2, ey, pupilRadius, 0, Math.PI * 2);
    ctx.fillStyle = pal.eyePupil;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eyeX + 0.5, ey - 1, 0.8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  });

  ctx.restore();
  ctx.restore();
}

function drawSnakeToroidal(snake) {
  if (!snake.alive) return;
  const offsets = [
    [0, 0],
    [width, 0], [-width, 0],
    [0, height], [0, -height],
    [width, height], [-width, height],
    [width, -height], [-width, -height]
  ];

  for (const [ox, oy] of offsets) {
    drawRealisticSnakeAt(snake, ox, oy);
  }
}

function render() {
  ctx.save();
  if (shakeIntensity > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
  }

  renderBackground();
  renderFood();
  renderParticles();

  // Draw Bots
  for (const bot of bots) {
    drawSnakeToroidal(bot);
  }

  // Draw Player on top
  drawSnakeToroidal(player);

  ctx.restore();
}

// ============================================================
// §9  LOOP
// ============================================================
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  statTimeEl = document.getElementById('stat-time');
  statLengthEl = document.getElementById('stat-length');
  statRankEl = document.getElementById('stat-rank');
  overlayEl = document.getElementById('overlay');
  finalTimeEl = document.getElementById('final-time');
  bestTimeEl = document.getElementById('best-time');
  finalLengthEl = document.getElementById('final-length');
  bestLengthEl = document.getElementById('best-length');

  onResize();
  initPlankton();
  initFood();
  initInput();
  initSnake();
  initBots();
  requestAnimationFrame(gameLoop);
});
</script>
</body>
