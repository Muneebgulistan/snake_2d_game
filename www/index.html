<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Serpents</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
    color: #e0f2fe;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(0,255,200,0.4);
  }
  .hud-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(4, 16, 36, 0.65);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(4px);
  }
  .hud-val {
    font-weight: bold;
    color: #38bdf8;
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="hud-stat">
    <span>Length:</span>
    <span id="stat-length" class="hud-val">30</span>
  </div>
</div>

<script>
// ============================================================
// §1  CONSTANTS
// ============================================================
const BASE_SPEED = 3.2;          // Movement speed in px/frame
const TURN_RATE = 0.075;         // Steering agility (radians per frame)
const SEGMENT_SPACING = 7;       // Distance between vertebrae segments
const INITIAL_SEGMENTS = 30;     // Starting snake length
const HEAD_RADIUS = 13;          // Radius of serpent head
const PLANKTON_COUNT = 55;       // Bioluminescent ambient particles
const FOOD_COUNT = 60;           // Total food orbs maintained in world

// Food palette colors
const FOOD_COLORS = [
  { core: '#22d3ee', glow: 'rgba(34, 211, 238, 0.5)' },   // Cyan
  { core: '#f43f5e', glow: 'rgba(244, 63, 94, 0.5)' },    // Neon Pink
  { core: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)' },   // Violet
  { core: '#10b981', glow: 'rgba(16, 185, 129, 0.5)' },   // Emerald
  { core: '#fbbf24', glow: 'rgba(251, 191, 36, 0.5)' }    // Amber
];

// Palette
const PALETTE_PLAYER = {
  head: '#00f5ff',
  bodyStart: '#06b6d4',
  bodyEnd: '#0369a1',
  scale: 'rgba(255, 255, 255, 0.35)',
  glow: 'rgba(0, 245, 255, 0.45)',
  eyeIris: '#0284c7',
  eyePupil: '#020617',
  tongue: '#f43f5e'
};

// ============================================================
// §2  STATE
// ============================================================
let canvas = null;
let ctx = null;
let width = window.innerWidth;
let height = window.innerHeight;
let animFrame = 0;

// Food orbs & particle effects
const foodOrbs = [];
const particles = [];
const plankton = [];

// Player snake state
const player = {
  x: width / 2,
  y: height / 2,
  angle: -Math.PI / 2,
  targetAngle: -Math.PI / 2,
  speed: BASE_SPEED,
  turnRate: TURN_RATE,
  length: INITIAL_SEGMENTS,
  segments: [],
  palette: PALETTE_PLAYER,
  tongueTimer: 0,
  tongueProgress: 0,
  bulges: [],                    // Swelling ripple animations [{index, strength}]
  growQueue: 0,
  alive: true,
};

// Input state
const keys = { left: false, right: false };
const mouse = { x: width / 2, y: height / 2, active: false };

// HUD DOM cache
let statLengthEl = null;

// ============================================================
// §3  TOROIDAL WRAP UTILITIES
// ============================================================

function wrap(val, max) {
  return ((val % max) + max) % max;
}

function toroidDelta(a, b, size) {
  let d = b - a;
  while (d > size * 0.5) d -= size;
  while (d < -size * 0.5) d += size;
  return d;
}

function toroidDistSq(x1, y1, x2, y2) {
  const dx = toroidDelta(x1, x2, width);
  const dy = toroidDelta(y1, y2, height);
  return dx * dx + dy * dy;
}

function angleDifference(current, target) {
  return Math.atan2(Math.sin(target - current), Math.cos(target - current));
}

function interpolateColor(hex1, hex2, factor) {
  const c1 = parseInt(hex1.slice(1), 16);
  const c2 = parseInt(hex2.slice(1), 16);

  const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;

  const r = Math.round(r1 + factor * (r2 - r1));
  const g = Math.round(g1 + factor * (g2 - g1));
  const b = Math.round(b1 + factor * (b2 - b1));

  return `rgb(${r}, ${g}, ${b})`;
}

// ============================================================
// §4  BACKGROUND, FOOD & PARTICLES
// ============================================================

function initPlankton() {
  plankton.length = 0;
  for (let i = 0; i < PLANKTON_COUNT; i++) {
    plankton.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: 1 + Math.random() * 2.2,
      baseAlpha: 0.15 + Math.random() * 0.45,
      vx: (Math.random() - 0.5) * 0.35,
      vy: -0.15 - Math.random() * 0.35,
      pulseSpeed: 0.02 + Math.random() * 0.03,
      pulsePhase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.4 ? 'rgba(56, 189, 248, ' : 'rgba(45, 212, 191, '
    });
  }
}

function updatePlankton() {
  for (const p of plankton) {
    p.x = wrap(p.x + p.vx, width);
    p.y = wrap(p.y + p.vy, height);
  }
}

/** Check if coordinate is safe from snake bodies */
function isFarFromSnakes(x, y, minDist = 40) {
  const minDistSq = minDist * minDist;
  if (toroidDistSq(player.x, player.y, x, y) < minDistSq) return false;
  for (let i = 0; i < player.segments.length; i += 3) {
    if (toroidDistSq(player.segments[i].x, player.segments[i].y, x, y) < minDistSq) {
      return false;
    }
  }
  return true;
}

function spawnFoodOrb() {
  let x = Math.random() * width;
  let y = Math.random() * height;
  for (let attempt = 0; attempt < 20; attempt++) {
    if (isFarFromSnakes(x, y, 40)) break;
    x = Math.random() * width;
    y = Math.random() * height;
  }

  const colorScheme = FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];
  return {
    x,
    y,
    baseRadius: 4.5 + Math.random() * 2,
    color: colorScheme.core,
    glow: colorScheme.glow,
    pulseSpeed: 0.04 + Math.random() * 0.04,
    pulsePhase: Math.random() * Math.PI * 2,
    vx: (Math.random() - 0.5) * 0.25,
    vy: (Math.random() - 0.5) * 0.25,
  };
}

function initFood() {
  foodOrbs.length = 0;
  for (let i = 0; i < FOOD_COUNT; i++) {
    foodOrbs.push(spawnFoodOrb());
  }
}

function updateFood() {
  for (const orb of foodOrbs) {
    orb.x = wrap(orb.x + orb.vx, width);
    orb.y = wrap(orb.y + orb.vy, height);
  }
  while (foodOrbs.length < FOOD_COUNT) {
    foodOrbs.push(spawnFoodOrb());
  }
}

function spawnFoodBurst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 2.8;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 2.5,
      alpha: 1,
      color,
      decay: 0.035 + Math.random() * 0.025
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x = wrap(p.x + p.vx, width);
    p.y = wrap(p.y + p.vy, height);
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

// ============================================================
// §5  INPUT HANDLING
// ============================================================

function initInput() {
  window.addEventListener('resize', onResize);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('touchstart', onTouch, { passive: false });
  window.addEventListener('touchmove', onTouch, { passive: false });
  window.addEventListener('touchend', () => { mouse.active = false; }, { passive: false });
}

function onTouch(e) {
  e.preventDefault();
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
  }
}

function onResize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}

// ============================================================
// §6  UPDATE
// ============================================================

function initSnake() {
  player.x = width / 2;
  player.y = height / 2;
  player.angle = -Math.PI / 2;
  player.targetAngle = -Math.PI / 2;
  player.length = INITIAL_SEGMENTS;
  player.growQueue = 0;
  player.bulges = [];
  player.segments = [];
  
  for (let i = 0; i < player.length; i++) {
    player.segments.push({
      x: player.x,
      y: player.y + i * SEGMENT_SPACING,
      angle: player.angle,
      lateralOffset: 0
    });
  }

  if (statLengthEl) statLengthEl.textContent = player.length;
}

function checkFoodConsumption() {
  const eatDistSq = (HEAD_RADIUS + 8) * (HEAD_RADIUS + 8);

  for (let i = foodOrbs.length - 1; i >= 0; i--) {
    const orb = foodOrbs[i];
    if (toroidDistSq(player.x, player.y, orb.x, orb.y) < eatDistSq) {
      // Eat orb
      spawnFoodBurst(orb.x, orb.y, orb.color);
      foodOrbs.splice(i, 1);

      // Trigger digestion swelling ripple down the body
      player.bulges.push({ index: 0, strength: 0.65 });
      player.growQueue++;
      player.length++;

      if (statLengthEl) statLengthEl.textContent = player.length;
    }
  }
}

function updatePlayer() {
  animFrame++;

  if (keys.left) {
    player.targetAngle -= player.turnRate;
    mouse.active = false;
  } else if (keys.right) {
    player.targetAngle += player.turnRate;
    mouse.active = false;
  } else if (mouse.active) {
    const dx = toroidDelta(player.x, mouse.x, width);
    const dy = toroidDelta(player.y, mouse.y, height);
    if (Math.hypot(dx, dy) > 15) {
      player.targetAngle = Math.atan2(dy, dx);
    }
  }

  const diff = angleDifference(player.angle, player.targetAngle);
  player.angle += Math.sign(diff) * Math.min(Math.abs(diff), player.turnRate);

  player.x = wrap(player.x + Math.cos(player.angle) * player.speed, width);
  player.y = wrap(player.y + Math.sin(player.angle) * player.speed, height);

  // Tongue flick
  player.tongueTimer++;
  if (player.tongueTimer > 180) {
    player.tongueProgress = Math.sin(((player.tongueTimer - 180) / 25) * Math.PI);
    if (player.tongueTimer >= 205) {
      player.tongueTimer = 0;
      player.tongueProgress = 0;
    }
  }

  // Update bulges traveling down the body
  for (let b = player.bulges.length - 1; b >= 0; b--) {
    player.bulges[b].index += 0.75;
    if (player.bulges[b].index >= player.segments.length) {
      player.bulges.splice(b, 1);
    }
  }

  // Grow tail if queued
  if (player.growQueue > 0 && player.segments.length > 0) {
    const tail = player.segments[player.segments.length - 1];
    player.segments.push({
      x: tail.x,
      y: tail.y,
      angle: tail.angle,
      lateralOffset: 0
    });
    player.growQueue--;
  }

  let prevX = player.x;
  let prevY = player.y;

  for (let i = 0; i < player.segments.length; i++) {
    const seg = player.segments[i];
    const dx = toroidDelta(seg.x, prevX, width);
    const dy = toroidDelta(seg.y, prevY, height);
    const dist = Math.hypot(dx, dy);

    if (dist > SEGMENT_SPACING) {
      const segAngle = Math.atan2(dy, dx);
      seg.angle = segAngle;
      seg.x = wrap(prevX - Math.cos(segAngle) * SEGMENT_SPACING, width);
      seg.y = wrap(prevY - Math.sin(segAngle) * SEGMENT_SPACING, height);
    }

    const waveProgress = i / player.segments.length;
    const waveAmp = Math.sin(waveProgress * Math.PI) * 4.5;
    seg.lateralOffset = Math.sin(animFrame * 0.14 - i * 0.32) * waveAmp;

    prevX = seg.x;
    prevY = seg.y;
  }

  checkFoodConsumption();
}

function update() {
  updatePlayer();
  updateFood();
  updateParticles();
  updatePlankton();
}

// ============================================================
// §7  RENDER: BACKGROUND, FOOD & SERPENT GRAPHICS
// ============================================================

function renderBackground() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
  bgGrad.addColorStop(0, '#030816');
  bgGrad.addColorStop(0.5, '#020b1f');
  bgGrad.addColorStop(1, '#01050f');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 4; i++) {
    const rayAngle = -0.35 + Math.sin(animFrame * 0.008 + i * 1.5) * 0.05;
    const rayX = ((width * (0.2 + i * 0.28)) + Math.sin(animFrame * 0.005 + i) * 60) % width;

    const rayGrad = ctx.createLinearGradient(rayX, 0, rayX + Math.tan(rayAngle) * height, height);
    rayGrad.addColorStop(0, 'rgba(56, 189, 248, 0.05)');
    rayGrad.addColorStop(0.5, 'rgba(14, 165, 233, 0.025)');
    rayGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');

    ctx.fillStyle = rayGrad;
    ctx.beginPath();
    ctx.moveTo(rayX - 35, 0);
    ctx.lineTo(rayX + 55, 0);
    ctx.lineTo(rayX + Math.tan(rayAngle) * height + 120, height);
    ctx.lineTo(rayX + Math.tan(rayAngle) * height - 80, height);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  for (const p of plankton) {
    const pulse = Math.sin(animFrame * p.pulseSpeed + p.pulsePhase);
    const alpha = p.baseAlpha + pulse * 0.15;
    ctx.fillStyle = p.color + alpha + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderFood() {
  for (const orb of foodOrbs) {
    const pulse = Math.sin(animFrame * orb.pulseSpeed + orb.pulsePhase);
    const radius = orb.baseRadius + pulse * 1.2;

    // Glowing halo
    ctx.fillStyle = orb.glow;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, radius * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Vibrant core
    ctx.fillStyle = orb.color;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, radius, 0, Math.PI * 2);
    ctx.fill();

    // Hot center
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(orb.x - radius * 0.25, orb.y - radius * 0.25, radius * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawDiamondScale(cx, cy, radius, angle, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, -radius * 0.7);
  ctx.lineTo(radius * 0.6, 0);
  ctx.lineTo(0, radius * 0.7);
  ctx.lineTo(-radius * 0.6, 0);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawRealisticSnakeAt(snake, offsetX, offsetY) {
  const segs = snake.segments;
  if (segs.length === 0) return;

  ctx.save();
  ctx.translate(offsetX, offsetY);

  const pal = snake.palette;

  // Tongue
  if (snake.tongueProgress > 0) {
    const tLen = snake.tongueProgress * 16;
    const hx = snake.x + Math.cos(snake.angle) * HEAD_RADIUS;
    const hy = snake.y + Math.sin(snake.angle) * HEAD_RADIUS;
    const tx = hx + Math.cos(snake.angle) * tLen;
    const ty = hy + Math.sin(snake.angle) * tLen;

    const forkAngle = 0.45;
    const forkLen = 5 * snake.tongueProgress;
    const f1x = tx + Math.cos(snake.angle + forkAngle) * forkLen;
    const f1y = ty + Math.sin(snake.angle + forkAngle) * forkLen;
    const f2x = tx + Math.cos(snake.angle - forkAngle) * forkLen;
    const f2y = ty + Math.sin(snake.angle - forkAngle) * forkLen;

    ctx.strokeStyle = pal.tongue;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(tx, ty);
    ctx.lineTo(f1x, f1y);
    ctx.moveTo(tx, ty);
    ctx.lineTo(f2x, f2y);
    ctx.stroke();
  }

  // Body segments
  for (let i = segs.length - 1; i >= 0; i--) {
    const seg = segs[i];
    const progress = i / segs.length;
    let radius = Math.max(3.5, HEAD_RADIUS * (1 - progress * 0.72));

    // Swelling digestion bulge ripple
    for (const b of snake.bulges) {
      const dist = Math.abs(i - b.index);
      if (dist < 3.5) {
        radius *= (1 + (1 - dist / 3.5) * b.strength);
      }
    }

    const perpAngle = seg.angle + Math.PI / 2;
    const drawX = seg.x + Math.cos(perpAngle) * seg.lateralOffset;
    const drawY = seg.y + Math.sin(perpAngle) * seg.lateralOffset;

    const segColor = interpolateColor(pal.bodyStart, pal.bodyEnd, progress);

    ctx.beginPath();
    ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
    ctx.fillStyle = segColor;
    if (i % 5 === 0) {
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = 6;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.fill();

    if (i % 2 === 0 && radius > 5) {
      drawDiamondScale(drawX, drawY, radius * 0.75, seg.angle, pal.scale);
    }
  }

  ctx.shadowBlur = 0;

  // Head
  ctx.save();
  ctx.translate(snake.x, snake.y);
  ctx.rotate(snake.angle);

  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 16;

  ctx.beginPath();
  ctx.ellipse(2, 0, HEAD_RADIUS + 1, HEAD_RADIUS - 1.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = pal.head;
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.ellipse(5, 0, HEAD_RADIUS * 0.45, HEAD_RADIUS * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fill();

  // Eyes
  const eyeX = 3;
  const eyeY = 6.2;
  const eyeRadius = 3.6;
  const pupilRadius = 1.6;

  [-eyeY, eyeY].forEach((ey) => {
    ctx.beginPath();
    ctx.arc(eyeX, ey, eyeRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eyeX + 0.8, ey, eyeRadius * 0.65, 0, Math.PI * 2);
    ctx.fillStyle = pal.eyeIris;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eyeX + 1.2, ey, pupilRadius, 0, Math.PI * 2);
    ctx.fillStyle = pal.eyePupil;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eyeX + 0.5, ey - 1, 0.8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  });

  ctx.restore();
  ctx.restore();
}

function drawSnakeToroidal(snake) {
  const offsets = [
    [0, 0],
    [width, 0], [-width, 0],
    [0, height], [0, -height],
    [width, height], [-width, height],
    [width, -height], [-width, -height]
  ];

  for (const [ox, oy] of offsets) {
    drawRealisticSnakeAt(snake, ox, oy);
  }
}

function render() {
  renderBackground();
  renderFood();
  renderParticles();
  drawSnakeToroidal(player);
}

// ============================================================
// §8  LOOP
// ============================================================
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  statLengthEl = document.getElementById('stat-length');
  onResize();
  initPlankton();
  initFood();
  initInput();
  initSnake();
  requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
